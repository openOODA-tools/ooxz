name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build the release asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ooxz

      - uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac

      - uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar

      - uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std

      - name: Require compiler and clang
        working-directory: ${{ github.workspace }}
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          if ! command -v clang >/dev/null; then sudo apt-get update && sudo apt-get install -y clang; fi
          command -v clang >/dev/null || { echo "clang is required for the build"; exit 1; }

      - name: Build the oodar runtime
        working-directory: ${{ github.workspace }}
        run: make -C oodar/scripts -f Makefile modular

      - name: Install the upstream tool
        working-directory: ${{ github.workspace }}
        run: |
          if ! command -v xz >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xz-utils
          fi
          if ! command -v xz >/dev/null 2>&1; then
            for cand in xz ; do
              for d in /usr/local/bin /usr/games /usr/bin /bin /usr/sbin /sbin; do
                if [ -x "$d/$cand" ]; then
                  sudo ln -sf "$d/$cand" /usr/local/bin/xz
                  break 2;
                fi
              done
            done
          fi
          command -v xz >/dev/null 2>&1 || { echo "::error::the upstream tool xz is required for the parity gate and the package xz-utils does not put it on this runner"; exit 1; }

      - name: Build, verify, and test
        working-directory: ${{ github.workspace }}/ooxz
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: "1"
        run: |
          make build
          make verify
          make test

      - name: Stage the release asset
        working-directory: ${{ github.workspace }}
        run: |
          test -x ooxz/dist/ooxz || { echo "::error::dist/ooxz was not produced"; exit 1; }
          cp ooxz/dist/ooxz ooxz-linux-x86_64
          sha256sum ooxz-linux-x86_64 > ooxz-linux-x86_64.sha256

      - name: Upload the release asset
        uses: actions/upload-artifact@v4
        with:
          name: ooxz-linux-x86_64
          path: |
            ooxz-linux-x86_64
            ooxz-linux-x86_64.sha256

  publish:
    needs: build
    uses: openOODA/openOODA/.github/workflows/auto-release.yml
    with:
      target_tag: ${{ github.ref_name }}
      artifact_pattern: ooxz-linux-x86_64
    permissions:
      contents: write

